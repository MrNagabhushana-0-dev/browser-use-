<!doctype html>
<meta charset="utf-8">
<title>An AI asks to use a site</title>
<body style="margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f0fa;color:#222">
<div style="padding:16px 18px">
<h2 style="margin:0 0 6px;font-size:17px">An AI you run asks to use <span id="site"></span></h2>
<p style="margin:0 0 6px;color:#555">It wants to open <span id="url" style="word-break:break-all"></span> in a tab it
shares with you, signed in as you are. Allow lets it use this site until the browser closes; Always keeps it allowed.</p>
</div>
<div style="position:fixed;right:18px;bottom:16px;display:flex;gap:10px">
<button id="no" style="font:inherit;padding:8px 18px;width:90px;background:#c62828;color:#fff;border:0">No</button>
<button id="always" style="font:inherit;padding:8px 18px;width:100px;background:#00695c;color:#fff;border:0">Always</button>
<button id="allow" style="font:inherit;padding:8px 18px;width:120px;background:#6a1b9a;color:#fff;border:0">Allow</button>
</div>
<script src="ask.js"></script>
</body>
